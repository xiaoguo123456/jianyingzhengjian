name: yingji-${DEPLOY_ENV:?}
x-app: &app
  image: ${APP_IMAGE:?}
  env_file: .env
  restart: unless-stopped
  read_only: true
  tmpfs: ["/tmp:size=32m"]
  security_opt: ["no-new-privileges:true"]
  cap_drop: [ALL]
  pids_limit: 96
  logging: &logging
    driver: json-file
    options: { max-size: "10m", max-file: "3" }
services:
  api:
    <<: *app
    ports: ["127.0.0.1:${API_PORT:?}:8080"]
    mem_limit: 128m
    cpus: 0.35
    networks:
      default: {}
      gateway:
        aliases: ["yingji-${DEPLOY_ENV}-api"]
    healthcheck:
      test: ["CMD", "/app/healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
  worker:
    <<: *app
    entrypoint: ["/app/worker"]
    mem_limit: 384m
    cpus: 0.5
    stop_grace_period: 300s
    healthcheck:
      test: ["CMD", "/app/healthcheck", "worker"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 30s
  migrate:
    <<: *app
    entrypoint: ["/app/migrate"]
    restart: "no"
    profiles: [tools]
    mem_limit: 192m
networks:
  gateway:
    external: true
    name: ${GATEWAY_NETWORK:?}
