# 仅用于本地开发；测试和生产使用现有 PostgreSQL、Redis 实例。
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: local-only
      POSTGRES_DB: yingji
    ports: ["127.0.0.1:5432:5432"]
    volumes: [postgres-data:/var/lib/postgresql/data]
  redis:
    image: redis:7
    command: redis-server --appendonly yes
    ports: ["6379:6379"]
  api:
    build: { context: .., dockerfile: deploy/Dockerfile.api }
    env_file: ../.env
    environment:
      DATABASE_URL: postgres://postgres:local-only@postgres:5432/yingji?sslmode=disable
      REDIS_ADDR: redis:6379
      LOCAL_STORAGE_DIR: /data/objects
    ports: ["8080:8080"]
    volumes: [objects:/data/objects]
    depends_on: [postgres, redis]
  worker:
    build: { context: .., dockerfile: deploy/Dockerfile.worker }
    env_file: ../.env
    environment:
      DATABASE_URL: postgres://postgres:local-only@postgres:5432/yingji?sslmode=disable
      REDIS_ADDR: redis:6379
      LOCAL_STORAGE_DIR: /data/objects
    volumes: [objects:/data/objects]
    depends_on: [postgres, redis]
volumes:
  postgres-data: {}
  objects: {}
