# 插入测试 Nginx server 块；只处理简影前缀。
location = /yingji {
    if ($host != test-www.qhzhiyin.com) { return 404; }
    return 308 https://test-www.qhzhiyin.com/yingji/;
}
location = /yingji/metrics { return 404; }
location /yingji/ {
    if ($host != test-www.qhzhiyin.com) { return 404; }
    client_max_body_size 21m;
    resolver 127.0.0.11 valid=10s;
    set $yingji_upstream http://yingji-test-api:8080;
    rewrite ^/yingji/(.*)$ /$1 break;
    proxy_pass $yingji_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 300s;
}
