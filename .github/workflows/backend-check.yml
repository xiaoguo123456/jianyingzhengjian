name: 后端检查
on:
  workflow_call:
  pull_request:
    paths: ['backend/**', '.github/workflows/**']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: yingji_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U postgres -d yingji_ci"
          --health-interval=10s --health-timeout=5s --health-retries=30
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: 'postgres://postgres:ci-only@127.0.0.1:5432/yingji_ci?sslmode=disable'
      TEST_DATABASE_URL: 'postgres://postgres:ci-only@127.0.0.1:5432/yingji_ci?sslmode=disable'
      TEST_REDIS_ADDR: '127.0.0.1:6379'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: 单元与数据库集成测试
        run: go test ./...
      - name: 静态检查
        run: go vet ./...
      - name: 验证迁移重复执行
        run: |
          go run ./cmd/migrate up
          go run ./cmd/migrate up
          go run ./cmd/migrate seed
