name: 生产环境手动部署
on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: 'main 分支中的完整 40 位提交 SHA'
        required: true
        type: string
permissions:
  contents: read
  actions: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 核对测试部署版本
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ inputs.commit_sha }}
        run: |
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]]
          git merge-base --is-ancestor "$SHA" origin/main
          result=$(gh run list --workflow test.yml --commit "$SHA" --status success --json databaseId --jq 'length')
          [[ "$result" -gt 0 ]] || { echo '此提交尚未成功部署到测试环境'; exit 1; }
  deploy:
    needs: check
    uses: ./.github/workflows/deploy.yml
    with:
      environment: production
      commit_sha: ${{ inputs.commit_sha }}
    secrets:
      DEPLOY_SSH_KEY: ${{ secrets.SSH_KEY }}
      DEPLOY_HOST: ${{ secrets.PROD_SSH_HOST }}
      DEPLOY_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
